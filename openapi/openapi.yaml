openapi: 3.0.3
info:
  title: Worker Collection и HR Web сервис
  description: |
    Два веб-сервиса:

    1. **worker-service** (`:8081`) — управление коллекцией `Worker` (CRUD, PATCH координат, фильтры, сортировка, пагинация, спец. операции).
    2. **hr-service** (`:8082`) — `/hr/fire` и `/hr/move`, вызывают API worker-service.

    Формат данных: **XML**. Параметры операций — в URL (path/query).
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: worker-service
  - url: http://localhost:8082
    description: hr-service

tags:
  - name: workers
    description: Базовые и специальные операции над коллекцией Worker
  - name: hr
    description: Дополнительные операции hr (увольнение и перемещение сотрудников)

paths:
  /workers:
    get:
      tags: [workers]
      summary: Получить массив элементов коллекции
      description: |
        Возвращает список работников с поддержкой:
        - фильтрации по любой комбинации полей;
        - сортировки по любому полю;
        - постраничной выдачи (`page`, `size`).
      operationId: getWorkers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - name: id
          in: query
          schema: { type: integer, format: int64, exclusiveMinimum: 0 }
          description: Фильтр по id
        - name: name
          in: query
          schema: { type: string, minLength: 1 }
          description: Фильтр по name
        - name: salary
          in: query
          schema: { type: number, format: float, exclusiveMinimum: 0 }
          description: Фильтр по salary
        - name: position
          in: query
          schema: { $ref: '#/components/schemas/Position' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/Status' }
        - name: creationDate
          in: query
          schema: { type: string, format: date }
        - name: coordinates.x
          in: query
          schema: { type: number, format: double, exclusiveMinimum: -250 }
        - name: coordinates.y
          in: query
          schema: { type: number, format: float }
        - name: person.height
          in: query
          schema: { type: integer, exclusiveMinimum: 0 }
        - name: person.eyeColor
          in: query
          schema: { $ref: '#/components/schemas/EyeColor' }
        - name: person.hairColor
          in: query
          schema: { $ref: '#/components/schemas/HairColor' }
        - name: person.nationality
          in: query
          schema: { $ref: '#/components/schemas/Country' }
        - name: person.location.x
          in: query
          schema: { type: integer, format: int64 }
        - name: person.location.y
          in: query
          schema: { type: number, format: float }
        - name: person.location.z
          in: query
          schema: { type: integer, format: int32 }
        - name: person.location.name
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Страница результатов выборки
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/WorkerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'

    post:
      tags: [workers]
      summary: Добавить новый элемент в коллекцию
      description: |
        Создаёт объект `Worker`. Поля `id` и `creationDate` генерируются сервисом автоматически
        и в запросе игнорируются (если переданы).
      operationId: createWorker
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/WorkerCreate'
      responses:
        '200':
          $ref: '#/components/responses/EmptyOk'
        '201':
          description: Элемент создан
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /workers/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkerIdPath'
    get:
      tags: [workers]
      summary: Получить элемент по ID
      operationId: getWorkerById
      responses:
        '200':
          description: |
            Найденный Worker. Если объект не найден — пустое тело.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'

    put:
      tags: [workers]
      summary: Обновить элемент по ID
      description: Полностью заменяет данные работника с указанным ID. `id` и `creationDate` не изменяются.
      operationId: updateWorker
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/WorkerUpdate'
      responses:
        '200':
          description: |
            Элемент обновлён. Если Worker (или связанная организация) не найден — пустое тело.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [workers]
      summary: Удалить элемент по ID
      operationId: deleteWorker
      responses:
        '200':
          description: Элемент удалён; если не найден — пустое тело
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

    patch:
      tags: [workers]
      summary: Частично обновить координаты Worker
      description: |
        Обновляет только поле `coordinates` у Worker с указанным ID.
        В теле можно передать одно или оба поля (`x`, `y`) — отсутствующие поля не изменяются.
        Остальные атрибуты Worker сохраняются без изменений.
      operationId: patchWorkerCoordinates
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/CoordinatesPatch'
      responses:
        '200':
          description: |
            Координаты обновлены, возвращён актуальный Worker.
            Если Worker не найден — пустое тело.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'


  /extra/delete-all-workers-with-person:
    delete:
      tags: [workers]
      summary: Удалить все объекты с заданным person
      description: |
        Удаляет все элементы коллекции, у которых значение поля `person` эквивалентно
        переданному. Параметры person передаются в query-строке URL.
        Если подходящих объектов нет — `200` с пустым телом.
      operationId: deleteWorkersByPerson
      parameters:
        - name: height
          in: query
          required: true
          schema: { type: integer, exclusiveMinimum: 0 }
        - name: eyeColor
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EyeColor' }
        - name: hairColor
          in: query
          required: false
          schema: { $ref: '#/components/schemas/HairColor' }
        - name: nationality
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Country' }
        - name: location.x
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: location.y
          in: query
          required: false
          schema: { type: number, format: float }
        - name: location.z
          in: query
          required: false
          schema: { type: integer, format: int32 }
        - name: location.name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Удаление выполнено; если подходящих объектов нет — пустое тело
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'


  /extra/delete-worker-with-salary:
    delete:
      tags: [workers]
      summary: Удалить один объект с заданным salary
      description: Удаляет один (любой) объект коллекции, у которого `salary` равен заданному значению.
      operationId: deleteOneWorkerBySalary
      parameters:
        - name: salary
          in: query
          required: true
          schema:
            type: number
            format: float
            exclusiveMinimum: 0
          description: Значение salary для поиска и удаления
      responses:
        '200':
          description: Объект удалён; если не найден — пустое тело
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'


  /extra/average-salary:
    get:
      tags: [workers]
      summary: Среднее значение salary по всей коллекции
      description: Рассчитывает среднее арифметическое поля `salary` для всех объектов коллекции.
      operationId: getAverageSalary
      responses:
        '200':
          description: Среднее значение salary
          content:
            application/xml:
              schema:
                type: number
                format: double
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'


  /hr/fire/{id}:
    post:
      tags: [hr]
      summary: Уволить сотрудника
      description: |
        Увольняет сотрудника с заданным `id`: через API worker-service выставляет `status=FIRED`
        и снимает с организации (`organizationId=null`).
        Если сотрудник уже `FIRED` — `409`.

        При успехе возвращает `303 See Other`: канонический ресурс `Worker` живёт на worker-service,
        поэтому клиент получает актуальные данные через `GET` по URI из заголовка `Location`
        (паттерн Post/Redirect/Get).
        Если сотрудник не найден — `200` с пустым телом.
      operationId: fireWorker
      parameters:
        - $ref: '#/components/parameters/WorkerIdPath'
      responses:
        '200':
          $ref: '#/components/responses/EmptyOk'
        '303':
          $ref: '#/components/responses/SeeOtherWorker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /hr/move/{worker-id}/{id-from}/{id-to}:
    post:
      tags: [hr]
      summary: Переместить сотрудника между организациями
      description: |
        Перемещает сотрудника `worker-id` из организации `id-from` в организацию `id-to`
        с сохранением должности (`position`) и заработной платы (`salary`).
        Реализуется через вызовы API worker-service (GET + PUT).
        Если сотрудник не состоит в `id-from` — `409`.

        При успехе возвращает `303 See Other` с `Location` на `GET /workers/{id}` worker-service
        (канонический ресурс после команды HR).
        Если сотрудник не найден — `200` с пустым телом.
      operationId: moveWorker
      parameters:
        - name: worker-id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            exclusiveMinimum: 0
          description: ID сотрудника
        - name: id-from
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID организации-источника
        - name: id-to
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID организации-назначения
      responses:
        '200':
          $ref: '#/components/responses/EmptyOk'
        '303':
          $ref: '#/components/responses/SeeOtherWorker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  parameters:
    WorkerIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        exclusiveMinimum: 0
      description: Уникальный идентификатор Worker (> 0)
    PageParam:
      name: page
      in: query
      description: Порядковый номер страницы (с нуля)
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SortParam:
      name: sort
      in: query
      description: |
        Поле сортировки. Допустимы имена полей Worker и вложенные пути
        (`salary`, `name`, `coordinates.x`, `person.height`, …).
      schema:
        type: string
    SortOrderParam:
      name: order
      in: query
      description: Направление сортировки
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  responses:
    BadRequest:
      description: Некорректные параметры URL/query или повреждённое тело запроса
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/BadRequestError'
          example: |
            <BadRequestError>
              <status>400</status>
              <errorCode>TYPE_MISMATCH</errorCode>
              <message>Некорректный параметр запроса</message>
              <parameter>id</parameter>
              <reason>Параметр 'id' имеет некорректный тип</reason>
            </BadRequestError>
    EmptyOk:
      description: |
        Ресурс не найден или операция не затронула данные — HTTP 200 с пустым телом
        (вместо 404).
    Conflict:
      description: Конфликт состояния или нарушение целостности данных
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/ConflictError'
          example: |
            <ConflictError>
              <status>409</status>
              <errorCode>STATE_CONFLICT</errorCode>
              <message>Работник уже уволен</message>
              <conflict>Работник уже уволен</conflict>
            </ConflictError>
    MethodNotAllowed:
      description: HTTP-метод не поддерживается для данного ресурса
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/MethodNotAllowedError'
          example: |
            <MethodNotAllowedError>
              <status>405</status>
              <errorCode>METHOD_NOT_ALLOWED</errorCode>
              <message>Метод не поддерживается</message>
              <method>POST</method>
              <supportedMethods>GET, PUT, PATCH, DELETE</supportedMethods>
            </MethodNotAllowedError>
    NotAcceptable:
      description: Клиент запросил неподдерживаемый Accept (ожидается application/xml)
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/NotAcceptableError'
          example: |
            <NotAcceptableError>
              <status>406</status>
              <errorCode>NOT_ACCEPTABLE</errorCode>
              <message>Неподдерживаемый Accept</message>
              <accept>application/json</accept>
              <supported>application/xml</supported>
            </NotAcceptableError>
    UnsupportedMediaType:
      description: Неподдерживаемый Content-Type (ожидается application/xml)
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/UnsupportedMediaTypeError'
          example: |
            <UnsupportedMediaTypeError>
              <status>415</status>
              <errorCode>UNSUPPORTED_MEDIA_TYPE</errorCode>
              <message>Неподдерживаемый Content-Type</message>
              <contentType>application/json</contentType>
              <supported>application/xml</supported>
            </UnsupportedMediaTypeError>
    UnprocessableEntity:
      description: Тело запроса синтаксически корректно, но не проходит Bean Validation
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example: |
            <ValidationError>
              <status>422</status>
              <errorCode>BODY_VALIDATION_FAILED</errorCode>
              <message>Ошибка валидации тела запроса</message>
              <violations>
                <violation>
                  <field>name</field>
                  <message>must not be blank</message>
                </violation>
                <violation>
                  <field>salary</field>
                  <message>must be greater than 0</message>
                </violation>
              </violations>
            </ValidationError>
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/InternalServerError'
          example: |
            <InternalServerError>
              <status>500</status>
              <errorCode>INTERNAL_ERROR</errorCode>
              <message>Внутренняя ошибка сервера</message>
            </InternalServerError>
    BadGateway:
      description: Ошибка при обращении HR-сервиса к worker-service
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/BadGatewayError'
          example: |
            <BadGatewayError>
              <status>502</status>
              <errorCode>UPSTREAM_ERROR</errorCode>
              <message>Ошибка при обращении к worker-service</message>
              <upstream>worker-service</upstream>
              <upstreamStatus>500</upstreamStatus>
              <upstreamBody>...</upstreamBody>
            </BadGatewayError>
    SeeOtherWorker:
      description: |
        Команда HR выполнена. Тело ответа пустое: актуальное состояние `Worker`
        нужно получить через `GET` по URI из заголовка `Location` на worker-service.
      headers:
        Location:
          description: URI канонического Worker на worker-service
          required: true
          schema:
            type: string
            format: uri
            example: http://localhost:8081/workers/1
    ServiceUnavailable:
      description: Временно недоступны БД или worker-service
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableError'
          example: |
            <ServiceUnavailableError>
              <status>503</status>
              <errorCode>DATABASE_UNAVAILABLE</errorCode>
              <message>Сервис временно недоступен (БД)</message>
              <dependency>database</dependency>
            </ServiceUnavailableError>

  schemas:
    Position:
      type: string
      enum: [DIRECTOR, HEAD_OF_DIVISION, DEVELOPER, MANAGER_OF_CLEANING]

    Status:
      type: string
      enum: [FIRED, RECOMMENDED_FOR_PROMOTION, REGULAR, PROBATION]

    EyeColor:
      type: string
      description: Цвет глаз (первый enum Color из ТЗ)
      enum: [GREEN, RED, WHITE, BROWN]

    HairColor:
      type: string
      description: Цвет волос (второй enum Color из ТЗ)
      enum: [GREEN, RED, BLACK, YELLOW, WHITE]

    Country:
      type: string
      enum: [USA, VATICAN, JAPAN]

    Coordinates:
      type: object
      required: [x]
      properties:
        x:
          type: number
          format: double
          exclusiveMinimum: -250
          description: Значение > -250, не null
        y:
          type: number
          format: float

    CoordinatesPatch:
      type: object
      description: |
        Тело PATCH для частичного обновления координат Worker.
        Передаются только изменяемые поля; нужно указать хотя бы одно из `x` или `y`.
      minProperties: 1
      properties:
        x:
          type: number
          format: double
          exclusiveMinimum: -250
          description: Значение > -250; если не передано — не меняется
        y:
          type: number
          format: float
          description: Если не передано — не меняется
      xml:
        name: coordinates

    Location:
      type: object
      required: [x, y, z]
      properties:
        x:
          type: integer
          format: int64
        y:
          type: number
          format: float
        z:
          type: integer
          format: int32
        name:
          type: string
          nullable: true

    Person:
      type: object
      required: [height, nationality]
      properties:
        height:
          type: integer
          exclusiveMinimum: 0
          description: Не null, значение > 0
        eyeColor:
          allOf:
            - $ref: '#/components/schemas/EyeColor'
          nullable: true
        hairColor:
          allOf:
            - $ref: '#/components/schemas/HairColor'
          nullable: true
        nationality:
          $ref: '#/components/schemas/Country'
        location:
          allOf:
            - $ref: '#/components/schemas/Location'
          nullable: true

    Worker:
      type: object
      required: [id, name, coordinates, creationDate, salary, status]
      properties:
        id:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: Уникальный, > 0, генерируется автоматически
          readOnly: true
        name:
          type: string
          minLength: 1
          description: Не null и не пустая строка
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date
          description: Генерируется автоматически
          readOnly: true
        salary:
          type: number
          format: float
          exclusiveMinimum: 0
        position:
          allOf:
            - $ref: '#/components/schemas/Position'
          nullable: true
        status:
          $ref: '#/components/schemas/Status'
        organizationId:
          type: integer
          format: int64
          nullable: true
          description: ID организации (для HR move/fire)
        person:
          allOf:
            - $ref: '#/components/schemas/Person'
          nullable: true
      xml:
        name: Worker

    WorkerCreate:
      type: object
      required: [name, coordinates, salary, status]
      description: Тело запроса на создание (без id и creationDate)
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        salary:
          type: number
          format: float
          exclusiveMinimum: 0
        position:
          allOf:
            - $ref: '#/components/schemas/Position'
          nullable: true
        status:
          $ref: '#/components/schemas/Status'
        organizationId:
          type: integer
          format: int64
          nullable: true
        person:
          allOf:
            - $ref: '#/components/schemas/Person'
          nullable: true
      xml:
        name: Worker

    WorkerUpdate:
      type: object
      required: [name, coordinates, salary, status]
      description: Тело запроса на обновление (id и creationDate не меняются)
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        salary:
          type: number
          format: float
          exclusiveMinimum: 0
        position:
          allOf:
            - $ref: '#/components/schemas/Position'
          nullable: true
        status:
          $ref: '#/components/schemas/Status'
        organizationId:
          type: integer
          format: int64
          nullable: true
        person:
          allOf:
            - $ref: '#/components/schemas/Person'
          nullable: true
      xml:
        name: Worker

    WorkerPage:
      type: object
      properties:
