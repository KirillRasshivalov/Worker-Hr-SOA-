services:
  postgres:
    image: postgres:16-alpine
    container_name: workerhr-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - workerhr_pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  workerhr_pg:
